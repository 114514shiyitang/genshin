<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原神牛逼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #0c1018;
            background-image: radial-gradient(circle at 50% 0%, #272e3b, #0c1018 65%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .wrap {
            width: 90%;
            max-width: 440px;
            text-align: center;
            padding: 45px 32px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            background-color: rgba(255, 255, 255, 0.04);
        }
        .title {
            font-size: 30px;
            color: #f8d29c;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        #uidInput {
            width: 100%;
            padding: 15px 16px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid rgba(248, 210, 156, 0.35);
            background: rgba(0, 0, 0, 0.35);
            color: #fff;
            outline: none;
            text-align: center;
        }
        #uidInput:focus {
            border-color: #f8d29c;
        }
        #startBtn {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background-color: #f8d29c;
            color: #0c1018;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        #startBtn:active {
            background-color: #e3bc83;
        }
        .message {
            margin-top: 18px;
            font-size: 16px;
            min-height: 26px;
        }
        .error-text {
            color: #ff6c6c;
        }
        .success-text {
            color: #77e298;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1 class="title">UID检测</h1>
        <input type="text" id="uidInput" placeholder="请输入9位UID" maxlength="9">
        <button id="startBtn">出发</button>
        <div class="message" id="msgBox"></div>
    </div>

<script>
    const input = document.getElementById("uidInput");
    const btn = document.getElementById("startBtn");
    const msgBox = document.getElementById("msgBox");
    const jumpUrl = "https://ys.mihoyo.com/main/m/?af_adset=1&utm_source=yuanshen_web";
    const min = 100000000;
    const max = 192070000;

    // 只能输入数字
    input.addEventListener("input", function () {
        this.value = this.value.replace(/[^\d]/g, "");
        msgBox.textContent = "";
        msgBox.className = "message";
    })

    // 点击【出发】校验
    btn.addEventListener("click", checkUID);
    // 回车键快捷检测
    input.addEventListener("keydown", e => {
        if (e.key === "Enter") checkUID();
    })

    function checkUID() {
        let val = input.value.trim();
        msgBox.className = "message";

        // 判断是否刚好9位
        if (val.length !== 9) {
            msgBox.textContent = "UID错误";
            msgBox.classList.add("error-text");
            setTimeout(() => input.value = "", 800);
            return;
        }

        let uid = Number(val);
        if (uid > min && uid < max) {
            msgBox.textContent = "验证成功";
            msgBox.classList.add("success-text");
            setTimeout(() => {
                window.location.href = jumpUrl;
            }, 1000);
        } else {
            msgBox.textContent = "验证失败，请重新输入";
            msgBox.classList.add("error-text");
            setTimeout(() => input.value = "", 800);
        }
    }
</script>
</body>
</html>
